name: Dist Diagnose

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install dist
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      - name: Capture plan
        shell: bash
        run: |
          set +e
          dist plan --output-format=json > dist-plan.json 2> dist-plan.stderr
          status=$?
          echo "$status" > dist-plan.exit
          cat dist-plan.stderr
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: dist-plan-diagnostics
          path: |
            dist-plan.json
            dist-plan.stderr
            dist-plan.exit
