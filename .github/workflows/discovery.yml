name: Agent discovery

on:
  pull_request:
    paths:
      - 'skills/**'
      - '.claude-plugin/**'
      - 'plugin.json'
      - 'context7.json'
      - 'llms.txt'
      - 'scripts/dev/*discovery*'
      - 'tests/discovery/**'
      - '.github/workflows/discovery.yml'
      - '.github/workflows/context7.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.claude-plugin/**'
      - 'plugin.json'
      - 'context7.json'
      - 'llms.txt'
      - 'scripts/dev/*discovery*'
      - 'tests/discovery/**'
      - '.github/workflows/discovery.yml'
      - '.github/workflows/context7.yml'
  workflow_dispatch:
    inputs:
      check:
        description: Choose installer validation, catalog observation, or both
        type: choice
        required: true
        default: installers
        options:
          - installers
          - catalog
          - all

permissions:
  contents: read

jobs:
  installers:
    name: Real skill and plugin installers
    if: github.event_name != 'workflow_dispatch' || inputs.check == 'installers' || inputs.check == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test audit and isolation helpers offline
        run: python3 -m unittest discover -s tests/discovery -p 'test_*.py' -v
      - name: Check Context7 publication plan without credentials or network
        run: >-
          python3 scripts/dev/publish-discovery-context7.py
          --action plan --report "$RUNNER_TEMP/discovery-reports/context7-plan.json"
      - name: Install pinned host tools without lifecycle scripts
        run: >-
          npm install --prefix "$RUNNER_TEMP/blotter-discovery-tools"
          --no-audit --no-fund --ignore-scripts
          skills@1.7.0 @anthropic-ai/claude-code@2.1.278
      # Claude's pinned npm package selects the native executable in postinstall.
      # Allow only that package's lifecycle, not arbitrary dependency scripts.
      - name: Select the pinned Claude native executable
        run: >-
          npm rebuild --prefix "$RUNNER_TEMP/blotter-discovery-tools"
          --foreground-scripts @anthropic-ai/claude-code@2.1.278
      - name: Validate and install in disposable homes
        run: >-
          python3 scripts/dev/check-discovery-hosts.py
          --skills "$RUNNER_TEMP/blotter-discovery-tools/node_modules/.bin/skills"
          --claude "$RUNNER_TEMP/blotter-discovery-tools/node_modules/.bin/claude"
          --report "$RUNNER_TEMP/discovery-reports/installers.json"
      # Fork refs do not exist in the fixed upstream repository; test those locally.
      - name: Verify Git-hosted delivery and native plugin caching
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          REMOTE_REF: ${{ github.head_ref || github.ref_name }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 scripts/dev/check-discovery-remote.py
          --skills "$RUNNER_TEMP/blotter-discovery-tools/node_modules/.bin/skills"
          --claude "$RUNNER_TEMP/blotter-discovery-tools/node_modules/.bin/claude"
          --ref "$REMOTE_REF" --expected-sha "$EXPECTED_SHA"
          --report "$RUNNER_TEMP/discovery-reports/remote.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-installers-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/discovery-reports/
            ${{ runner.temp }}/blotter-discovery-tools/package-lock.json
          retention-days: 14
          if-no-files-found: warn

  catalog:
    name: Public catalog observation (not a ranking gate)
    # External observation is opt-in, independent of ordinary PR validation.
    if: github.event_name == 'workflow_dispatch' && (inputs.check == 'catalog' || inputs.check == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Observe branded and problem-language searches
        run: python3 scripts/dev/audit-discovery.py --live --report "$RUNNER_TEMP/catalog.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-catalog-${{ github.run_id }}
          path: ${{ runner.temp }}/catalog.json
          retention-days: 14
          if-no-files-found: warn
