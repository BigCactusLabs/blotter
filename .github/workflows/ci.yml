name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Gates (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --all-features
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Format
        run: cargo fmt --check
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install documentation-only dependencies
        run: python -m pip install --disable-pip-version-check --only-binary=:all: -r site/requirements.txt
      - name: Documentation checker regressions
        run: python -m unittest discover -s tests/docs -v
      - name: Source documentation and executable README
        run: python scripts/dev/check-docs.py --binary target/release/blotter
      - name: Discovery packaging and isolated CLI smoke
        run: python3 scripts/dev/check-discovery.py --binary target/release/blotter
      - name: Demonstrate recurrence and intervention evidence
        run: |
          python3 scripts/dev/demo-discovery-proof.py --binary target/release/blotter > "$RUNNER_TEMP/discovery-proof.json"
          cat "$RUNNER_TEMP/discovery-proof.json"
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/discovery-proof.json
          retention-days: 14
          if-no-files-found: error
      - name: Leak gate on the dogfood log
        run: cargo run --quiet -- doctor --leaks

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - name: Build on MSRV (locked, all features)
        run: cargo build --locked --all-features
